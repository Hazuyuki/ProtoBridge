# ProtoBridge protocol config -- H200 NVLS allgather (builtin delegate).
#
# `builtin = nvls` sources the profile's PEX + fabric-hardware values into the
# inline path's local variables and runs the NvlsAllGather injector verbatim
# (bit-identical to the inline `--collective=allgather --algorithm=nvls` run
# with the profile's values as flags). NVLS (NVLink Sharp / in-network reduce)
# requires the switched (NVSwitch) fabric.
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-nvls-allgather.cfg --numGpus=8 --dataSize=1048576"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
builtin  = nvls
topology = switched
