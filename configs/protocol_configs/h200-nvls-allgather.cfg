# ProtoBridge protocol config -- H200 NVLS allgather (calibrated delegate).
#
# Declaring `collective = allgather` + `algorithm = nvls` sources the profile's
# fabric-hardware + protocol values into the inline path's local CLI variables
# (the PEX-bundle keys go to the bundle object via `Build()`, not CLI vars) and
# runs the NvlsAllGather injector verbatim (bit-identical to the inline
# `--collective=allgather --algorithm=nvls` run with the profile's values as
# flags). NVLS (NVLink Sharp / in-network reduce) requires the switched
# (NVSwitch) fabric. The TRUE H200 fabric models each GPU hanging off the
# NVSwitch by 18 separate point-to-point NVLink4 lanes at 170 Gbps effective
# per-lane (aggregate 3060 Gbps trunk) with spray routing; pass
# --linksPerGpu=18 --bandwidth=170 on the CLI to provision it (the CLI
# default linksPerGpu=1 hangs each GPU off the switch by ONE link at 170
# Gbps, under-provisioning the trunk 18x -- the switch's full-D multicast
# egress then serializes on a single 170 Gbps link). The earlier
# --linkDataRate=3060 convention collapsed the 18 lanes into ONE p2p pipe
# (no spray) and is retired. Same convention as the tree calibration anchor
# (see h200-tree-allreduce.cfg and
# examples/gpu-cluster/surrogate_ns3_consistency.py).
#
# Run (18-link spray fabric, N=8 / 64 MiB -> ~228 us):
#   ./ns3 run "gpu-cluster-sim --topology=switched --collective=allgather \
# --algorithm=nvls --numGpus=8 --dataSize=67108864 --bandwidth=170 \
# --latency=400 --numLanes=18 --vcCredits=104857600 --fabricType=1 \
# --protocolModel=ns3::NcclProtocolModel --linksPerGpu=18 --forceProtocol=0 \
# --startupLL=15000 --startupLL128=25000 --startupSIMPLE=46000 --RngRun=1"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
collective = allgather
algorithm  = nvls
topology   = switched
