# ProtoBridge protocol config -- H200 NVLS allgather (calibrated delegate).
#
# Declaring `collective = allgather` + `algorithm = nvls` sources the profile's
# fabric-hardware + protocol values into the inline path's local CLI variables
# (the PEX-bundle keys go to the bundle object via `Build()`, not CLI vars) and
# runs the NvlsAllGather injector verbatim (bit-identical to the inline
# `--collective=allgather --algorithm=nvls` run with the profile's values as
# flags). NVLS (NVLink Sharp / in-network reduce) requires the switched
# (NVSwitch) fabric.
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-nvls-allgather.cfg --numGpus=8 --dataSize=1048576"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
collective = allgather
algorithm  = nvls
topology   = switched
