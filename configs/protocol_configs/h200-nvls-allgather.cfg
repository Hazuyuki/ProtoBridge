# ProtoBridge protocol config -- H200 NVLS allgather (calibrated delegate).
#
# Declaring `collective = allgather` + `algorithm = nvls` sources the profile's
# fabric-hardware + protocol values into the inline path's local CLI variables
# (the PEX-bundle keys go to the bundle object via `Build()`, not CLI vars) and
# runs the NvlsAllGather injector verbatim (bit-identical to the inline
# `--collective=allgather --algorithm=nvls` run with the profile's values as
# flags). NVLS (NVLink Sharp / in-network reduce) requires the switched
# (NVSwitch) fabric. For a physical H200 GPU<->NVSwitch trunk, also pass
# --linkDataRate=3060 on the CLI: 3060 Gbps = 18 lanes x 170 Gbps effective
# per-lane = the full trunk (the switched topology hangs each GPU off the
# switch by ONE link at this rate; the profile's bandwidthGbps=170 is a
# PER-LANE value, and without --linkDataRate the builder falls back to it,
# under-provisioning the trunk 18x -- the switch's full-D multicast egress
# then serializes on a single 170 Gbps link). Same convention as the tree
# calibration anchor (see h200-tree-allreduce.cfg and
# configs/calibration/surrogate_ns3_consistency.py).
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-nvls-allgather.cfg --numGpus=8 \
# --dataSize=1048576 --linkDataRate=3060"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
collective = allgather
algorithm  = nvls
topology   = switched
