# ProtoBridge protocol config -- H200 tree allreduce (calibrated delegate).
#
# Declaring `collective = allreduce` + `algorithm = tree` sources the profile's
# fabric-hardware + protocol values into the inline path's local CLI variables
# (the PEX-bundle keys go to the bundle object via `Build()`, not CLI vars) and
# runs the TreeAllReduce injector verbatim (bit-identical to the inline
# `--collective=allreduce --algorithm=tree` run with the profile's values as
# flags). Tree allreduce runs over the switched (NVSwitch) fabric. The TRUE
# H200 fabric models each GPU hanging off the NVSwitch by 18 separate
# point-to-point NVLink4 lanes at 170 Gbps effective per-lane (aggregate
# 3060 Gbps trunk) with spray routing (the endpoint round-robins 128 KiB
# spray chunks across the links); pass --linksPerGpu=18 --bandwidth=170 on
# the CLI when reproducing the tree calibration. The earlier
# --linkDataRate=3060 convention collapsed the 18 lanes into ONE p2p pipe
# (no spray, no per-link queues) and is retired. The surrogate tree preset
# (tree_bw_per_level=275400 B/us, t_min_switch=4.10 us, structural
# alpha(N)=1/2/3 trunk-load model) is back-fit to the 18-link
# configuration -- see configs/calibration/tree_ns3_sweep.py. (The historical
# per-protocol 80/100/50 Gbps values were fitted against the pre-volume-fix
# under-transferring tree and are retired.)
#
# Run (tree-calibration convention, N=8 / 256 MiB -> ~2699 us):
#   ./ns3 run "gpu-cluster-sim --topology=switched --collective=allreduce \
# --algorithm=tree --numGpus=8 --dataSize=268435456 --bandwidth=170 \
# --latency=400 --numLanes=18 --vcCredits=104857600 --fabricType=1 \
# --protocolModel=ns3::NcclProtocolModel --linksPerGpu=18 --forceProtocol=0 \
# --startupLL=15000 --startupLL128=25000 --startupSIMPLE=46000 --RngRun=1"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
collective = allreduce
algorithm  = tree
topology   = switched
