# ProtoBridge protocol config -- H200 tree allreduce (calibrated delegate).
#
# Declaring `collective = allreduce` + `algorithm = tree` sources the profile's
# PEX + fabric-hardware values into the inline path's local variables and runs
# the TreeAllReduce injector verbatim (bit-identical to the inline
# `--collective=allreduce --algorithm=tree` run with the profile's values as
# flags). Tree allreduce runs over the switched (NVSwitch) fabric. For closest
# fidelity to measured tree latency, the inline path also accepts --linkDataRate
# (a switched-fabric per-link rate distinct from --bandwidth); pass it on the
# CLI when reproducing a tree calibration.
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-tree-allreduce.cfg --numGpus=8 --dataSize=1048576"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
collective = allreduce
algorithm  = tree
topology   = switched
