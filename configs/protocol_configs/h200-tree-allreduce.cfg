# H200 single-host NCCL Tree AllReduce over the switched profile.
# The profile supplies 18 physical links per GPU at 170 Gb/s per link.
# Supply the communicator limit at launch when the NCCL graph is known.
# A separate eight-rank H200 probe reported 24 channels. To reproduce that
# assumption, run from the ProtoBridge root:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=configs/protocol_configs/h200-tree-allreduce.cfg --numGpus=8 --dataSize=16777216 --treeMaxChannels=24"
# RESULT reports the active channels, rank order and delivered bytes per hop.

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
collective = allreduce
algorithm  = tree
topology   = switched
