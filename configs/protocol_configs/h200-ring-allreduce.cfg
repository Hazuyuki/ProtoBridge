# ProtoBridge protocol config -- H200 ring allreduce.
#
# Two abstraction layers, declared in one file:
#   [stack]  PEX (packet execution) -- the protocol/FEC/credit/LLR bundle,
#            by reference to a ProtocolProfile.
#   [op]     OTP (operation to packet) -- the operation as a replicated
#            stencil of logical transfers; the compiler expands each transfer
#            through the vendor ProtocolModel (which emits ACTION + delivery
#            WAIT nodes), so the config declares transfers, not raw nodes.
#
# This reproduces the hardcoded RingAllReduce injector: N GPUs, 2*(N-1) steps,
# each step sends one segment (dataSize/N) to (gpu+1) mod N. The wire protocol
# is auto-selected from the segment size; the startup delay is auto-resolved
# from the protocol model for the total data size at N GPUs.
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-ring-allreduce.cfg --numGpus=8 --dataSize=1048576"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
# Symbolic params (evaluated in order; may reference numGpus, dataSize, and
# earlier params). Integer arithmetic only.
param.N       = numGpus
param.segment = dataSize / N
param.steps   = 2 * (N - 1)

# Replication domain: one transfer instance per (gpu, step) combination. The
# first dim (gpu) is the chain axis -- each gpu's steps are chained in order.
replicate.gpu  = 0 .. N-1
replicate.step = 0 .. steps-1

# Per-gpu protocol launch overhead. "auto" = the protocol model's startup
# delay for the total data size at N GPUs (matches RingAllReduce::Initialize).
startup = auto

# Inter-step software overhead (ns) inserted between a gpu's consecutive steps.
# 0 matches the default RingAllReduce run (no per-step overhead).
per_step_delay = 0

# The transfer stencil, evaluated per (gpu, step) instance with gpu/step/N/segment
# in scope. flowId and stageId are assigned by the compiler.
transfer.0.kind  = DATA
transfer.0.src   = gpu
transfer.0.dst   = (gpu + 1) mod N
transfer.0.bytes = segment
transfer.0.vc    = 0

# Completion: every gpu's final step must deliver (ALL).
complete = all
