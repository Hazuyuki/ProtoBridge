# ProtoBridge protocol config -- H200 ring allreduce (calibrated).
#
# Two abstraction layers in one file:
#   [stack]  PEX (packet execution) -- the protocol/FEC/credit/LLR bundle +
#            fabric hardware, by reference to a ProtocolProfile.
#   [op]     OTP (operation to packet) -- here `collective = allreduce` +
#            `algorithm = ring` delegates to the calibrated RingAllReduce
#            injector instead of declaring a transfer stencil.
#
# Declaring `collective` + `algorithm` sources the profile's PEX +
# fabric-hardware values into the same local variables the validated inline
# path consumes, then runs the RingAllReduce injector verbatim. Because every
# sourced key maps 1:1 to an inline CLI flag, this is bit-identical to the
# inline command:
#   gpu-cluster-sim --topology=ring --collective=allreduce --algorithm=ring \
#     --numGpus=8 --dataSize=1048576 \
#     --bandwidth=170 --latency=400 --numLanes=18 --sprayChunkSize=131072 \
#     --startupLL=15000 --startupLL128=25000 --startupSIMPLE=46000 \
#     --llThreshold=8192 --ll128Threshold=2097152 --forceProtocol=0 \
#     --fecN=544 --fecK=514 --fecT=15 --berIntraNodeElectrical=1e-15 ...
# (run test/parity/test_config_vs_inline_parity.py to verify). numGpus and
# dataSize stay on the CLI. 8-GPU 1MB -> ~35.8us (measured 37.24us), 256MB ->
# ~1280us (measured 1347.65us).
#
# topology = ring is required: the ring injector on a switched fabric does NOT
# reproduce the measured latency (it runs ~6x slower).
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-ring-allreduce.cfg --numGpus=8 --dataSize=1048576"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
# Delegate to the calibrated RingAllReduce injector (no transfer stencil).
collective = allreduce
algorithm  = ring
topology   = ring
