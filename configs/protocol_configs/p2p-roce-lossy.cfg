# ProtoBridge protocol config -- RoCE v2 P2P over a LOSSY link, go-back-N.
#
# Same single-transfer stencil as p2p-roce.cfg (rank 0 -> rank N-1, kind=P2P,
# startup=950 doorbell floor), but with link-level retry ARMED via [stack]
# overrides (inline [stack] keys override the referenced profile,
# scratch/gpu-cluster-sim.cc prof.Set loop): llrEnabled=1 + llrMode=gobackn.
# The base h200-ll128 profile carries llrEnabled=0, and config-mode sourcing
# overrides the CLI --llrEnabled -- without the [stack] override the first
# drop would stall the transfer forever.
#
# This is the ns-3 side of the SRNIC NSDI'23 Figure 11 comparison (ConnectX-6
# 100G measured goodput vs injected packet loss rate; congestion control
# DISABLED; perftest 4 KB messages; the CX-6 curve is go-back-N recovery, the
# SRNIC curve is selective repeat -> see p2p-roce-lossy-sack.cfg):
#   - fabric: --interNodeFabricType=RoCE --interNodeTopology=tor
#     --interNodeBandwidth=100 (CX-6 100G) --numNodes=2 --gpusPerNode=2
#     (gpusPerNode>=2 is REQUIRED: the m_localRankCount>1 guard in
#     FabricEndpoint::GetProtocolModelForDest selects the RoCE So model;
#     at gpusPerNode=1 remote dests silently fall back to the Su model)
#   - message granularity: --bulkChunkSize=4096 (perftest 4 KB messages; the
#     default 8 MiB coalescing makes per-packet loss statistically invisible)
#   - loss: --packetLossRate=p --ber=0 (loss isolated from the BER/FEC path)
#
# Known structural bound (report honestly, do not hide): the bulk-send loop
# assigns ALL chunk sequence numbers in one synchronous dispatch, so a NACK
# retransmits from the lost seq to the end of the assigned range -- the GBN
# "window" is effectively the whole remaining message, not the NIC's
# tx-depth/BDP window. The simulated GBN curve therefore collapses at lower
# loss rates than the measured CX-6 curve (which bounds waste at ~RTT x C per
# drop). --perQpCeilingGbps bounds the WIRE rate but not this window.
#
# Driven by examples/gpu-cluster/eth_gbn_loss_sweep.py; reference data in
# examples/gpu-cluster/srnic_fig11_cx6_reference.csv.

[stack]
profile = configs/protocol_profiles/h200-ll128.profile
llrEnabled = 1
llrMode = gobackn
# Effectively-infinite VC credits: the reference RoCE testbed has NO
# link-level credit flow control (lossy Ethernet), and our CREDIT control
# packets are NOT covered by LLR -- with the profile's 64-credit budget a
# randomly dropped CREDIT permanently starves the sender (artifact stall
# recovered only by the coarse retry timeout). Huge credits make CREDIT
# drops harmless, isolating the gobackn-vs-sack recovery comparison.
vcCredits = 100000000

[op]
param.N = numGpus
replicate.gpu = 0 .. 0
startup = 950
per_step_delay = 0
transfer.0.kind  = P2P
transfer.0.src   = 0
transfer.0.dst   = N - 1
transfer.0.vc    = 0
transfer.0.bytes = dataSize
complete = all
