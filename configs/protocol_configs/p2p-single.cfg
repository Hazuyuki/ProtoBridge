# ProtoBridge protocol config -- single P2P transfer (ib_write_lat-style).
#
# One rank sends a single message to one peer (gpu 0 -> gpu 1), kind = P2P,
# dispatched through ProtocolConfigRunner::OnAction ->
# FabricEndpoint::SendBulkWireTransferSize (the bulk wire path, NCCL-protocol
# framed: protocol auto-selected from effectiveBytes -- at --dataSize=64 the
# NCCL LL framing gives wireSize=128 at efficiency=0.5). This is NOT
# FabricEndpoint::SendP2p -- the raw single-packet P2P path without NCCL
# framing -- which is exercised by the background P2P traffic
# (--bgP2p, P2pTraffic::SendPackets; see p2p-roce.cfg for the send-path
# distinction). ``startup = 0`` makes it a bare transfer with no NCCL
# collective startup delay, so the completion callback's
# ``Simulator::Now() - m_startNs`` is the single-transfer latency --
# directly comparable to ib_write_lat.
#
# This profile uses the H200 NVLink (LL128) PEX bundle, so a run on
# ``--topology=switched`` measures an NVLink P2P latency. For a RoCEv2
# scale-out P2P use p2p-roce.cfg (the inter-node RoceProtocolModel is wired
# out-of-band; the analytical calibrated model is surrogate
# ``make_connectx7_p2p_perftest_theory``).
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/p2p-single.cfg --numGpus=2 --dataSize=65536 \
# --topology=switched"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
param.N = numGpus
replicate.gpu = 0 .. 0
startup = 0
per_step_delay = 0
transfer.0.kind  = P2P
transfer.0.src   = 0
transfer.0.dst   = 1 mod N
transfer.0.bytes = dataSize
transfer.0.vc    = 0
complete = all
