# GPU-initiated RC RDMA Write. Run with --numNodes=2 --gpusPerNode=2.
# See doc/IBGDA.md for timings, mode selection and completion definitions.
[stack]
profile = configs/protocol_profiles/ibgda-roce.profile

[op]
param.N = numGpus
startup = auto
transfer.0.kind = P2P
transfer.0.src = 0
transfer.0.dst = N - 1
transfer.0.bytes = dataSize
transfer.0.vc = 0
complete = all
