# ProtoBridge protocol config -- single RoCE v2 P2P transfer (ib_write_lat-style).
#
# One rank sends a single message to an INTER-NODE peer (rank 0 on node 0 ->
# rank N-1 on the last node), kind = P2P. This exercises the inter-node RoCE
# path: FabricEndpoint::GetProtocolModelForDest returns the RoceProtocolModel
# for a remote dest (m_localRankCount>1 guard, fabric-endpoint.cc:721), and the
# .cfg SEND_P2P action is routed through SendBulkWireTransferSize
# (protocol-config-runner.cc:136). Completion is DELIVERY-gated: m_startNs at
# Start() (runner.cc:109) -> OnPacketReceived stamps PACKET_DELIVERED
# (runner.cc:165) -> transaction-graph WAIT -> OnComplete -> durationNs =
# Now - m_startNs (runner.cc:185). So simTimeUs IS the single-transfer
# delivery latency, directly comparable to ib_write_lat.
#
# dst = N - 1 guarantees the dest is the LAST rank = the last node (inter-node)
# whenever numNodes > 1. With numNodes=2 gpusPerNode=2, numGpus is overwritten to
# numNodes*gpusPerNode = 4 (scratch/gpu-cluster-sim.cc:793) and passed to the
# config runner (:1327), so N=4 and dst=3 = node1/gpu1 = inter-node. The plain
# '1 mod N' would stay intra-node (rank 1 = node0/gpu1) when gpusPerNode>=2,
# which is required anyway: gpusPerNode>=2 satisfies the m_localRankCount>1
# guard that selects the RoCE model (fabric-endpoint.cc:721).
#
# startup = 950 is the per-message doorbell+completion floor, sweep-fit to
# ib_write_lat (examples/gpu-cluster/roce_p2p_ns3_sweep.json best fit). The
# ib_write_lat 2 B latency is 1.45 us = doorbell+completion (1.05 us per
# roce_p2p_calib.json per_message_fixed_latency_us) + same-switch propagation
# (0.4 us). In ns-3 the floor decomposes as startup(950) + 2*interNodeLatency
# (2*100) + switchCutThroughDelay(200) = 1350 ns + ~150 ns residual
# scheduling/arbiter overhead -> measured 2 B = 1.50 us. The 0.4 us "prop" term
# from the analytical surrogate maps onto 2*lat + cutThrough = 400 ns here.
# This reuses the transaction-graph startup-delay mechanism; it is NOT the
# RoceProtocolModel's 40000ns StartupDelayNs (that is NCCL-scale and is not
# consumed when `startup` is a literal).
#
# [stack] keeps the NVLink (h200-ll128) PEX bundle, which governs only the Su
# model on local-rank traffic; the inter-node RoCE model is wired out-of-band
# (scratch/gpu-cluster-sim.cc CreateObject<RoceProtocolModel> + SetInterNode
# ProtocolModel when --interNodeFabricType=RoCE), independent of [stack].
#
# Calibrated single-transfer run (ib_write_lat parity, ConnectX-7 400G), sweep-
# fit by examples/gpu-cluster/roce_p2p_ns3_sweep.py (MAPE 5.26 %):
#   --interNodeBandwidth=400 (line rate; the GPU->switch->GPU path serializes
#     on 2 P2P links, so 2x serialization at 400 Gbps yields the ~199 Gbps
#     single-write rate -- roce_p2p_calib.json single_write_serialization_rate)
#   --interNodeLatency=100  --switchCutThroughDelay=200 (default)
#   --interNodeTopology=tor (single shared leaf = 1 hop; 'host' is multi-hop)
# Measured simTimeUs vs ib_write_lat:
#   2B 1.50/1.45(+3.4%)  64B 1.50/1.48(+1.4%)  1KB 1.50/1.62(-7.4%)
#   4KB 1.70/1.88(-9.6%)  64KB 4.40/4.21(+4.5%)
# The floor (2 B) and slope (64 KB) match within 3-5 %; the 1-4 KB transition
# UNDERSHOOTS because ib_write_lat is sublinear (NIC pipeline, S^0.669) while
# ns-3 serialization is linear in size -- the same divergence the analytical
# surrogate shows (it carries the S^0.669 term so fits the transition at 2.60 %
# MAPE; ns-3 cannot, structurally). This is the honest structural floor of the
# ns-3 wire model. Sustained throughput (ib_write_bw, per-QP 49 Gbps) needs the
# opt-in PerQpCeilingGbps (WU3) + large dataSizes that pipeline MTU chunks on one
# flowKey==one QP via SendBulkWireTransferSize -- not this single-transfer cfg.
#
# Run (ib_write_lat parity):
#   ./ns3 run "gpu-cluster-sim --numNodes=2 --gpusPerNode=2 \
#     --interNodeFabricType=RoCE --interNodeTopology=tor \
#     --interNodeBandwidth=400 --interNodeLatency=100 \
#     --protocolConfig=configs/protocol_configs/p2p-roce.cfg --dataSize=65536"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
param.N = numGpus
replicate.gpu = 0 .. 0
startup = 950
per_step_delay = 0
transfer.0.kind  = P2P
transfer.0.src   = 0
transfer.0.dst   = N - 1
transfer.0.vc    = 0
transfer.0.bytes = dataSize
complete = all
