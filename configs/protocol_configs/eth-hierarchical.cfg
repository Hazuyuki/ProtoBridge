# ProtoBridge protocol config -- hierarchical allreduce over a PLAIN (non-RoCE)
# lossy Ethernet scale-out fabric, FULLY CONFIG-DRIVEN (no --interNode* CLI).
#
# This is the config-primary counterpart to p2p-eth.cfg / p2p-eth-incast.cfg
# (which select the So fabric via --interNodeFabricType CLI flags). Here the
# [stack] overrides below select the lossy Ethernet So fabric
# (interNodeFabricType = ETH) + its topology/hardware, so ONE config adapts
# across protocols: swap "ETH" -> "RoCE" for the lossless variant, with no
# change to the run command. The [op] delegates to the calibrated
# HierarchicalAllReduce injector. numNodes / gpusPerNode / dataSize stay on the
# CLI (scale axes, like numGpus/dataSize in the Su config-primary path).
#
# The inter-node sourcing (scratch/gpu-cluster-sim.cc) maps each [stack] key
# 1:1 to an inline --interNode* CLI flag, so this config run is BIT-IDENTICAL
# to the inline command built from the same values (same code, same RNG):
#   gpu-cluster-sim --numNodes=2 --gpusPerNode=8 \
#     --interNodeFabricType=ETH --interNodeTopology=host \
#     --interNodeBandwidth=400 --interNodeLatency=100 \
#     --collective=allreduce --algorithm=hierarchical \
#     --bandwidth=170 --latency=400 --numLanes=18 --sprayChunkSize=131072 \
#     --fecN=544 --fecK=514 --fecT=15 --berIntraNodeElectrical=1e-15 ... \
#     --dataSize=268435456 --RngRun=1
# (verified by test/parity/test_config_vs_inline_eth.py).
#
# Non-blocking host topology + a single allreduce = no incast, so the lossy
# VOQ tail-drop/NACK path does not engage (zero drops, deterministic) -- this
# cfg is the config-driven completion + parity smoke; the lossy retransmit
# loop is exercised by test/parity/test_ethernet_lossy_recovery.py.
#
# Run (config-driven hierarchical allreduce over lossy Ethernet):
#   ./ns3 run "gpu-cluster-sim --numNodes=2 --gpusPerNode=8 \
#     --protocolConfig=configs/protocol_configs/eth-hierarchical.cfg \
#     --dataSize=268435456 --RngRun=1"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile
interNodeFabricType = ETH
interNodeTopology = host
interNodeBandwidthGbps = 400
interNodeLatencyNs = 100

[op]
collective = allreduce
algorithm  = hierarchical
