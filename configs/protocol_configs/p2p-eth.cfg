# ProtoBridge protocol config -- single plain (non-RoCE) Ethernet P2P transfer.
#
# One rank sends a single message to an INTER-NODE peer (rank 0 on node 0 ->
# rank N-1 on the last node), kind = P2P, over a PLAIN lossy Ethernet scale-out
# fabric -- the contrast to p2p-roce.cfg's lossless RoCEv2. This lights up the
# previously-dead FabricType::ETHERNET enum: scratch/gpu-cluster-sim.cc selects
# the EthernetSwitch subtype + an EthernetProtocolModel (out-of-band, via
# SetInterNodeProtocolModel), independent of [stack].
#
# Loss model (the crux): plain Ethernet is LOSSY. The EthernetSwitch tail-drops
# a DATA packet once its VOQ crosses VoqDropThreshold and emits a NACK back to
# the source (EmitNackBack), which the sender retransmits via the LLR/SACK path
# (ProcessNackPacket -> GBN/SACK; LlrManager::OnRetryTimeout is the backstop if
# the NACK itself is lost). This is the OPPOSITE of RoCE, which avoids drops via
# lossless ECN marking. --ber=0 --packetLossRate=0 so the ONLY loss source is
# VOQ tail-drop (deterministic; isolates the retransmit path). A single
# unidirectional P2P does not congest (no incast), so it completes with zero
# drops -- this cfg is the completion smoke test; the lossy NACK->retransmit
# path is exercised by the incast scenario in the C++ test suite.
#
# Precondition: plain Ethernet REQUIRES link-level retry -- without LLR the
# tail-drop is silent and the transfer stalls forever. scratch/gpu-cluster-sim.cc
# forces llrEnabled=1 for --interNodeFabricType=ETH (a fabric precondition, like
# RoCE's ECN/PFC infra). The retransmit mode (llrMode) is shared Su/So: the
# h200-ll128 [stack] profile below sets llrMode=gobackn for the Su NVLink model
# (NVLink relies on FEC, not ARQ), and applyS lets the profile override the CLI
# --llrMode, so this single-P2P run retransmits in gobackn. Both gobackn and sack
# retransmit and complete (sack retransmits only the NACKed packet, gobackn
# retransmits from the NACK onward -- more wasteful under incast). To force
# sack for the So fabric, point [stack] at a profile with llrMode=sack or drop
# the line. --llrRetryLimit=8 bounds the loop under persistent incast
# (permanent-loss fallback); --llrRetryTimeout=5000ns is the backstop if a NACK
# is lost. The lossy NACK->retransmit path itself is exercised under incast in
# the C++ test suite (EthernetSwitchDropTest), not by this no-drop single P2P.
#
# Wire model: WireEfficiency=1.0 (EthernetProtocolModel) so the
# `efficiency<1.0 && RocePayloadBuilder` gate in SendBulkWireTransferSize stays
# false -- no SoHeader encapsulation, no DCQCN/per-QP ceiling (those are
# RDMA-NIC concepts, not present on a plain Ethernet NIC). GetProtocolId returns
# 0 (NONE) so the non-bulk SendDataAutoProtocol path stamps protocol=0. The
# physical contrast vs RoCE is store-and-forward switch latency (higher than
# RoCE cut-through), which dominates at small messages.
#
# startup = 1500 is the store-and-forward NIC-driver floor (spec/NIC-derived,
# NOT sweep-fit: there is no perftest ground truth for plain Ethernet, unlike
# RoCE's ib_write_lat). It reuses the transaction-graph startup-delay mechanism;
# it is NOT the EthernetProtocolModel's StartupDelayNs (that is not consumed
# when `startup` is a literal). The inter-node collective-level NCCL launch
# startup is layered above via --interNodeStartup in collective configs.
#
# This cfg is a RUNNABLE STENCIL + completion smoke test, not a calibration
# anchor: the surrogate-vs-ns3 parity for the Ethernet So profile lives in
# test/parity/test_surrogate_vs_ns3_ethernet.py (ns-3-anchored, no HW anchor).
#
# Run (single-transfer completion smoke):
#   ./ns3 run "gpu-cluster-sim --numNodes=2 --gpusPerNode=2 \
#     --interNodeFabricType=ETH --interNodeTopology=tor \
#     --interNodeBandwidth=400 --interNodeLatency=100 \
#     --llrEnabled=1 --llrMode=sack --llrRetryTimeout=5000 --llrRetryLimit=8 \
#     --ber=0 --packetLossRate=0 \
#     --protocolConfig=configs/protocol_configs/p2p-eth.cfg --dataSize=65536"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
param.N = numGpus
replicate.gpu = 0 .. 0
startup = 1500
per_step_delay = 0
transfer.0.kind  = P2P
transfer.0.src   = 0
transfer.0.dst   = N - 1
transfer.0.vc    = 0
transfer.0.bytes = dataSize
complete = all
