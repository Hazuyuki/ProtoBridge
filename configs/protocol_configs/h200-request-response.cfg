# ProtoBridge protocol config -- H200 request/response (ping-pong).
#
# A second example showing the OTP stencil can express operations beyond ring:
# gpu 0 sends a small request to gpu 1, which sends a larger response back.
# Two transfers are declared (transfer.0 then transfer.1); within the single
# instance they are chained by a graph dependency -- transfer.1's ACTION fires
# only after transfer.0's delivery WAIT completes (the executor advances on
# NotifyEvent). No memory-semantic path is used: both legs are DATA packets.
#
# Run:
#   ./ns3 run "gpu-cluster-sim --protocolConfig=\
# configs/protocol_configs/h200-request-response.cfg --numGpus=8 --dataSize=4096"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
param.N = numGpus

# Single instance (gpu 0 only). One chain group, two transfers chained.
replicate.gpu = 0 .. 0

startup = auto
per_step_delay = 0

# Request leg: gpu 0 -> gpu 1.
transfer.0.kind  = DATA
transfer.0.src   = 0
transfer.0.dst   = 1 mod N
transfer.0.bytes = 4096
transfer.0.vc    = 0

# Response leg: gpu 1 -> gpu 0 (fires after transfer.0 delivers at gpu 1).
transfer.1.kind  = DATA
transfer.1.src   = 1 mod N
transfer.1.dst   = 0
transfer.1.bytes = 65536
transfer.1.vc    = 0

complete = all
