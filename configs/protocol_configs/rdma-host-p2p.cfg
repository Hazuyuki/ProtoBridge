# CPU-issued RDMA between host-memory payload buffers.
[stack]
profile = configs/protocol_profiles/rdma-common.profile
rdmaInitiator = cpu
rdmaDataPath = host

[op]
param.N = numGpus
startup = auto
transfer.0.kind = P2P
transfer.0.src = 0
transfer.0.dst = N - 1
transfer.0.bytes = dataSize
transfer.0.vc = 0
complete = all
