# ProtoBridge protocol config -- plain-Ethernet incast (lossy NACK->retransmit).
#
# Two ranks on node 0 (ranks 0,1) each P2P-send to rank 3 on node 1 (the last
# rank = last node, inter-node). Both flows converge on the switch's egress
# port toward node 1, contending for that port's VOQ -- the incast that fills
# the lossy EthernetSwitch tail-drop path. This is the e2e complement to
# EthernetSwitchDropTest: it drives the FULL NACK->LLR-retransmit->delivery
# recovery through the event-driven datapath, not just the drop decision.
#
# Run with a low --voqDropThreshold and small --bulkChunkSize so the dest-port
# VOQ overflows reliably (the default 8MB chunk would emit one packet per flow,
# too coarse to congest). --ber=0 --packetLossRate=0 so the ONLY loss source is
# VOQ tail-drop (deterministic). llrEnabled is forced by scratch for the ETH
# path on BOTH the endpoint sender (StorePacket + ProcessNackPacket) AND the So
# switch (m_llrEnabled=true or EmitNackBack no-ops and the drop is silent ->
# stall); --llrRetryTimeout=5000ns is the backstop if a NACK is itself lost.
#
# --llrRetryLimit=64 is set HIGH so retransmits keep trying until the VOQ
# drains between attempts: under this 2-flow incast every dropped packet is
# eventually recovered (permanentLosses==0), demonstrating the FULL
# NACK->LLR-retransmit->delivery loop. For contrast, --llrRetryLimit=8 yields
# permanentLosses>0 -- the faithful permanent-loss fallback once retries
# exhaust, the lossy-Ethernet degradation RoCE's PFC exists to prevent. That
# is correct severe-congestion behavior, not a retransmit failure: the run
# still COMPLETES.
#
# Success criteria (DoD step 5): the run COMPLETES (exit 0) with
# switchVoqDrops > 0 (the lossy path fired), retransmittedPackets > 0 (the
# NACK->retransmit recovery fired) AND permanentLosses == 0 (every dropped
# packet recovered). A broken retransmit path would hang at the 3600s
# Simulator::Stop ceiling (no delivery -> no completion) with
# retransmittedPackets == 0 and retryBufferPeak > 0.
#
# dst = N-1 = 3 (last rank, last node) so both senders 0,1 on node 0 send
# inter-node to node 1. numNodes=2 gpusPerNode=2 -> numGpus=4 (overwritten at
# scratch:793). gpusPerNode>=2 satisfies the m_localRankCount>1 guard that
# selects the Ethernet So model for a remote dest (fabric-endpoint.cc:721).
#
# Run (incast lossy-retransmit smoke; dataSize=4194304 since the
# linksPerGpu=18 profile re-anchor -- 256KB no longer fills the dest-port VOQ
# through the wider 18-lane spray trunk):
#   ./ns3 run "gpu-cluster-sim --numNodes=2 --gpusPerNode=2 \
#     --interNodeFabricType=ETH --interNodeTopology=tor \
#     --interNodeBandwidth=400 --interNodeLatency=100 \
#     --voqDropThreshold=2 --bulkChunkSize=16384 \
#     --llrMode=sack --llrRetryTimeout=5000 --llrRetryLimit=64 \
#     --ber=0 --packetLossRate=0 \
#     --protocolConfig=configs/protocol_configs/p2p-eth-incast.cfg --dataSize=4194304"

[stack]
profile = configs/protocol_profiles/h200-ll128.profile

[op]
param.N = numGpus
# One replication GROUP per sender: transfers within a group chain, groups run
# in parallel. A single group with two transfers would SERIALIZE sender 1
# behind sender 0's delivery (chained groupDep) — the opposite of incast.
# gpusPerNode=2 sends from node-0 ranks 0,1; N-1 = last rank on node 1.
replicate.gpu = 0 .. 1
startup = 1500
per_step_delay = 0
transfer.0.kind  = P2P
transfer.0.src   = gpu
transfer.0.dst   = N - 1
transfer.0.vc    = 0
transfer.0.bytes = dataSize
complete = all
