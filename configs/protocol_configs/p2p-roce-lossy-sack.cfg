# ProtoBridge protocol config -- RoCE v2 P2P over a LOSSY link, SELECTIVE repeat.
#
# Identical to p2p-roce-lossy.cfg except llrMode=sack: on a NACK only the
# lost packet is retransmitted (selective repeat), not everything from the
# lost seq onward. This is the analogue of the SRNIC (NSDI'23) design point
# in Figure 11 -- SRNIC's selective-repeat RNIC only drops from 97 to
# ~75 Gbps goodput at 1% injected loss, where the go-back-N ConnectX-6
# collapses to ~25 Gbps. Sweeping both cfgs over --packetLossRate reproduces
# the gobackn-vs-selective-repeat SPREAD of Figure 11 in ns-3.
#
# See p2p-roce-lossy.cfg for the full testbed mapping + structural caveats.
# Driven by configs/calibration/eth_gbn_loss_sweep.py.

[stack]
profile = configs/protocol_profiles/h200-ll128.profile
llrEnabled = 1
llrMode = sack
# Effectively-infinite VC credits (see p2p-roce-lossy.cfg): CREDIT control
# packets are not LLR-protected, so a dropped CREDIT under the 64-credit
# budget is an artifact stall. The RoCE reference testbed has no link-level
# credit flow control.
vcCredits = 100000000

[op]
param.N = numGpus
replicate.gpu = 0 .. 0
startup = 950
per_step_delay = 0
transfer.0.kind  = P2P
transfer.0.src   = 0
transfer.0.dst   = N - 1
transfer.0.vc    = 0
transfer.0.bytes = dataSize
complete = all
