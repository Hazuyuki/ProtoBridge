name: build-and-test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 python3-pip ccache

      - name: Install Python deps
        run: |
          # ubuntu-24.04 marks pip as externally-managed, so
          # --break-system-packages is required to install pytest (the only
          # dependency in surrogate/requirements.txt) into the system
          # interpreter that runs the tests.
          pip3 install --break-system-packages -r surrogate/requirements.txt

      - name: ccache env
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache --set-config=compress=true 2>/dev/null || true
          ccache --set-config=max_size=1G 2>/dev/null || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ns-3 (examples + tests, ccache launcher)
        run: |
          # release, not optimized: the optimized profile enables
          # -march=native -mtune=native (CMakeLists.txt NS3_NATIVE_OPTIMIZATIONS),
          # and the cross-SHA ccache restore-keys then share those objects
          # across GitHub-hosted runners with divergent CPU microarchitectures
          # (the "native" string hashes identically, so ccache hits a
          # different runner's objects) -> SIGILL in the test-runner.
          # release keeps -O3 (CMAKE_BUILD_TYPE=release) but drops
          # -march=native, so every runner runs the same baseline ISA.
          ./ns3 configure --enable-examples --enable-tests -d release -- \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ./ns3 build

      - name: ccache stats
        run: ccache -s || true

      - name: C++ test suites
        run: |
          ./ns3 run "test-runner --test-name=gpu-cluster"
          ./ns3 run "test-runner --test-name=gpu-cluster-integration"

      - name: Smoke (interconnect collective)
        run: |
          out=$(./ns3 run "gpu-cluster-sim --numGpus=8 --topology=switched --algorithm=auto --dataSize=1048576")
          echo "$out"
          echo "$out" | grep -q "simTimeUs=" || { echo "no RESULT line"; exit 1; }

      - name: Python surrogate tests
        run: python3 -m pytest surrogate/test/ -q
